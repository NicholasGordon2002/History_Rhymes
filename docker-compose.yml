services:
  # One-shot: creates SQLite DB file and runs schema migrations, then exits
  db-init:
    build:
      context: ./services/db-init
    volumes:
      - db-data:/data
    networks:
      - hr-network
    environment:
      DB_PATH: /data/history_rhymes.db
    restart: "no"

  # Polls Wikipedia On This Day + GDELT for candidate pairings
  trend-scout:
    build:
      context: ./services/trend-scout
    volumes:
      - db-data:/data
    networks:
      - hr-network
    environment:
      DB_PATH: /data/history_rhymes.db
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: "no"

  # Stub: reads candidates, writes a selected record, exits
  topic-scorer:
    build:
      context: ./services/topic-scorer
    volumes:
      - db-data:/data
    networks:
      - hr-network
    environment:
      DB_PATH: /data/history_rhymes.db
      ANTHROPIC_API_KEY: placeholder-anthropic-api-key
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: "no"

  # Multi-source fact pulling with citations for selected topics
  research:
    build:
      context: ./services/research
    volumes:
      - db-data:/data
    networks:
      - hr-network
    environment:
      DB_PATH: /data/history_rhymes.db
      ANTHROPIC_API_KEY: placeholder-anthropic-api-key
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: "no"

  # Stub
  scriptwriter:
    build:
      context: ./services/scriptwriter
    volumes:
      - db-data:/data
    networks:
      - hr-network
    environment:
      DB_PATH: /data/history_rhymes.db
      ANTHROPIC_API_KEY: placeholder-anthropic-api-key
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: "no"

  # Stub
  visual-sourcing:
    build:
      context: ./services/visual-sourcing
    volumes:
      - db-data:/data
    networks:
      - hr-network
    environment:
      DB_PATH: /data/history_rhymes.db
      STOCK_LIBRARY_API_KEY: placeholder-stock-library-api-key
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: "no"

  # Stub
  voice-gen:
    build:
      context: ./services/voice-gen
    volumes:
      - db-data:/data
    networks:
      - hr-network
    environment:
      DB_PATH: /data/history_rhymes.db
      TTS_API_KEY: placeholder-tts-api-key
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: "no"

  # Stub
  assembly:
    build:
      context: ./services/assembly
    volumes:
      - db-data:/data
    networks:
      - hr-network
    environment:
      DB_PATH: /data/history_rhymes.db
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: "no"

  # FastAPI review dashboard on port 8000
  review-ui:
    build:
      context: ./services/review-ui
    volumes:
      - db-data:/data
    networks:
      - hr-network
    ports:
      - "8000:8000"
    environment:
      DB_PATH: /data/history_rhymes.db
      REVIEW_UI_HOST: "0.0.0.0"
      REVIEW_UI_PORT: "8000"
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: "unless-stopped"

  # Uploads approved videos to YouTube Shorts via OAuth 2.0
  publisher:
    build:
      context: ./services/publisher
    volumes:
      - db-data:/data
      # Mount the videos directory so publisher can access rendered files.
      # In production, point this at the assembly output directory.
      - ./videos:/videos
    networks:
      - hr-network
    environment:
      DB_PATH: /data/history_rhymes.db
      # YouTube OAuth 2.0 credentials — obtain from Google Cloud Console
      # See services/publisher/main.py docstring for setup instructions.
      YOUTUBE_CLIENT_ID: placeholder-youtube-client-id
      YOUTUBE_CLIENT_SECRET: placeholder-youtube-client-secret
      YOUTUBE_REFRESH_TOKEN: placeholder-youtube-refresh-token
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: "no"

  # Pulls YouTube performance metrics and closes the learning loop
  analytics:
    build:
      context: ./services/analytics
    volumes:
      - db-data:/data
    networks:
      - hr-network
    environment:
      DB_PATH: /data/history_rhymes.db
      # YouTube OAuth 2.0 credentials — shared with publisher service
      # See services/publisher/main.py docstring for setup instructions.
      YOUTUBE_CLIENT_ID: placeholder-youtube-client-id
      YOUTUBE_CLIENT_SECRET: placeholder-youtube-client-secret
      YOUTUBE_REFRESH_TOKEN: placeholder-youtube-refresh-token
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: "no"

volumes:
  db-data:
    driver: local

networks:
  hr-network:
    driver: bridge
