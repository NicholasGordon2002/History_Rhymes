services:
  # One-shot: creates SQLite DB file and runs schema migrations, then exits
  db-init:
    build:
      context: ./services/db-init
    volumes:
      - db-data:/data
    networks:
      - hr-network
    environment:
      DB_PATH: /data/history_rhymes.db
    restart: "no"

  # --- Pipeline services (manual-only — started by scheduler) ---

  trend-scout:
    build:
      context: ./services/trend-scout
    volumes:
      - db-data:/data
    networks:
      - hr-network
    environment:
      DB_PATH: /data/history_rhymes.db
      WIKIPEDIA_ON_THIS_DAY_URL: https://en.wikipedia.org/api/rest_v1/feed/onthisday/events
      NEWS_API_KEY: placeholder-news-api-key
      GOOGLE_TRENDS_API_KEY: placeholder-google-trends-api-key
    restart: "no"

  topic-scorer:
    build:
      context: ./services/topic-scorer
    volumes:
      - db-data:/data
    networks:
      - hr-network
    environment:
      DB_PATH: /data/history_rhymes.db
      ANTHROPIC_API_KEY: placeholder-anthropic-api-key
    restart: "no"

  research:
    build:
      context: ./services/research
    volumes:
      - db-data:/data
    networks:
      - hr-network
    environment:
      DB_PATH: /data/history_rhymes.db
    restart: "no"

  scriptwriter:
    build:
      context: ./services/scriptwriter
    volumes:
      - db-data:/data
    networks:
      - hr-network
    environment:
      DB_PATH: /data/history_rhymes.db
      ANTHROPIC_API_KEY: placeholder-anthropic-api-key
    restart: "no"

  visual-sourcing:
    build:
      context: ./services/visual-sourcing
    volumes:
      - db-data:/data
    networks:
      - hr-network
    environment:
      DB_PATH: /data/history_rhymes.db
      STOCK_LIBRARY_API_KEY: placeholder-stock-library-api-key
    restart: "no"

  voice-gen:
    build:
      context: ./services/voice-gen
    volumes:
      - db-data:/data
    networks:
      - hr-network
    environment:
      DB_PATH: /data/history_rhymes.db
      TTS_API_KEY: placeholder-tts-api-key
    restart: "no"

  assembly:
    build:
      context: ./services/assembly
    volumes:
      - db-data:/data
    networks:
      - hr-network
    environment:
      DB_PATH: /data/history_rhymes.db
    restart: "no"

  publisher:
    build:
      context: ./services/publisher
    volumes:
      - db-data:/data
    networks:
      - hr-network
    environment:
      DB_PATH: /data/history_rhymes.db
      YOUTUBE_API_KEY: placeholder-youtube-api-key
    restart: "no"

  analytics:
    build:
      context: ./services/analytics
    volumes:
      - db-data:/data
    networks:
      - hr-network
    environment:
      DB_PATH: /data/history_rhymes.db
      YOUTUBE_API_KEY: placeholder-youtube-api-key
    restart: "no"

  # --- Daemon (auto-starts) ---

  # FastAPI review dashboard on port 8000 — the only always-on daemon
  review-ui:
    build:
      context: ./services/review-ui
    volumes:
      - db-data:/data
    networks:
      - hr-network
    ports:
      - "8000:8000"
    environment:
      DB_PATH: /data/history_rhymes.db
      REVIEW_UI_HOST: "0.0.0.0"
      REVIEW_UI_PORT: "8000"
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: "unless-stopped"

  # --- Pipeline orchestrator (one-shot) ---

  scheduler:
    build:
      context: ./services/scheduler
    volumes:
      - db-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/repo:ro
    networks:
      - hr-network
    environment:
      DB_PATH: /data/history_rhymes.db
      REPO_PATH: /repo
      COMPOSE_FILE: /repo/docker-compose.yml
      COMPOSE_PROJECT_NAME: history-rhymes
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: "no"

volumes:
  db-data:
    driver: local

networks:
  hr-network:
    driver: bridge
