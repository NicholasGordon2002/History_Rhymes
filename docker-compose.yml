        condition: service_completed_successfully
    restart: "no"

  # Stub
  analytics:
    build:
      context: ./services/analytics
    volumes:
      - db-data:/data
    networks:
      - hr-network
    environment:
      DB_PATH: /data/history_rhymes.db
      YOUTUBE_API_KEY: placeholder-youtube-api-key
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: "no"

volumes:
  db-data:
    driver: local

networks:
  hr-network:
    driver: bridge
